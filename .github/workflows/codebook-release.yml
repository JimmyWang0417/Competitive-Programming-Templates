name: Build and release codebooks

"on":
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      publish_release:
        description: "构建完成后是否发布 GitHub Release"
        required: true
        default: false
        type: boolean
      release_tag:
        description: "Release 标签；留空则使用最新稳定版本 + 0.0.1"
        required: false
        default: ""
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install fonts
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk fonts-dejavu-core

      - name: Install Typst
        uses: typst-community/setup-typst@v5
        with:
          typst-version: 0.15.1

      - name: Build wide and compact PDFs
        run: |
          mkdir -p dist
          typst compile --root . codebook/wide/main.typ dist/competitive-programming-templates-wide.pdf
          typst compile --root . codebook/compact/main.typ dist/competitive-programming-templates-compact.pdf

      - name: Upload PDFs
        uses: actions/upload-artifact@v7
        with:
          name: competitive-programming-codebooks
          path: dist/*.pdf

      - name: Resolve release tag
        id: release
        if: >-
          startsWith(github.ref, 'refs/tags/v') ||
          (github.event_name == 'workflow_dispatch' && inputs.publish_release)
        env:
          MANUAL_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            release_tag="$GITHUB_REF_NAME"
          elif [[ -n "$MANUAL_TAG" ]]; then
            release_tag="$MANUAL_TAG"
          else
            latest_tag=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1)
            if [[ "$latest_tag" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
              release_tag="v${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.$((BASH_REMATCH[3] + 1))"
            else
              release_tag="v0.0.1"
            fi
          fi

          if [[ ! "$release_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $release_tag" >&2
            exit 1
          fi

          echo "tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "Release tag: $release_tag"

      - name: Publish release
        if: steps.release.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${{ steps.release.outputs.tag }}"
          dist/competitive-programming-templates-wide.pdf
          dist/competitive-programming-templates-compact.pdf
          --generate-notes
          --title "${{ steps.release.outputs.tag }}"
