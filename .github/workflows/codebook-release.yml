name: Build and release codebooks

"on":
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install fonts
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk fonts-dejavu-core

      - name: Install Typst
        uses: typst-community/setup-typst@v4
        with:
          typst-version: 0.15.1

      - name: Build wide and compact PDFs
        run: |
          mkdir -p dist
          typst compile --root . codebook/wide/main.typ dist/competitive-programming-templates-wide.pdf
          typst compile --root . codebook/compact/main.typ dist/competitive-programming-templates-compact.pdf

      - name: Upload PDFs
        uses: actions/upload-artifact@v4
        with:
          name: competitive-programming-codebooks
          path: dist/*.pdf

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}"
          dist/competitive-programming-templates-wide.pdf
          dist/competitive-programming-templates-compact.pdf
          --verify-tag
          --generate-notes
          --title "${GITHUB_REF_NAME}"
